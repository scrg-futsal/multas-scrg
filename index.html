<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Multas SCRG">
<title>MULTAS SCRG 26/27</title>
<link rel="icon" id="ic-fav" href="data:,">
<link rel="apple-touch-icon" id="ic-apple" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: camisola de jogo — faixa diagonal vermelho/preto no topo, cartões limpos, navegação inferior com botões grandes */
:root{
  --bg:#F6F4F3; --surface:#FFFFFF; --surface-2:#F0ECEA; --ink:#161314; --ink-2:#5E5557; --line:#E3DCDA;
  --red:#C8102E; --red-ink:#FFFFFF; --red-soft:#FBE7EA; --black:#161314; --black-ink:#FFFFFF;
  --good:#1E7A46; --good-soft:#E3F3E9; --warn:#A35A00; --warn-soft:#FFF1DC;
  --chart-pay:#2B2627; --chart-grid:rgba(22,19,20,.08);
  --gold:#C99A2E; --silver:#8F9499; --bronze:#A8673A;
  --f-display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --nav-h:68px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0D0E; --surface:#1A1718; --surface-2:#242021; --ink:#F4F0EF; --ink-2:#B3AAAB; --line:#332D2E;
  --red:#E8283F; --red-ink:#FFFFFF; --red-soft:#3A1419; --black:#000000; --black-ink:#FFFFFF;
  --good:#5BC98A; --good-soft:#12301F; --warn:#F2A541; --warn-soft:#352409;
  --chart-pay:#D9D2D1; --chart-grid:rgba(244,240,239,.09); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F0D0E; --surface:#1A1718; --surface-2:#242021; --ink:#F4F0EF; --ink-2:#B3AAAB; --line:#332D2E;
  --red:#E8283F; --red-ink:#FFFFFF; --red-soft:#3A1419; --black:#000000; --black-ink:#FFFFFF;
  --good:#5BC98A; --good-soft:#12301F; --warn:#F2A541; --warn-soft:#352409;
  --chart-pay:#D9D2D1; --chart-grid:rgba(244,240,239,.09); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
a{color:var(--red)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:20;color:#fff;
  background:linear-gradient(160deg,var(--red) 0 58%,var(--black) 58% 100%);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top img{width:44px;height:44px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.brand{min-width:0;flex:1}
.brand h1{font-size:clamp(1.15rem,5.4vw,1.55rem);font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:.78rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;
  min-height:40px;padding:0 12px;cursor:pointer;font-size:.85rem;font-weight:600}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:#7CF0A6;display:inline-block}
.live.off i{background:#ccc}

main{max-width:980px;margin:0 auto;padding:16px 16px 0}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.page-h h2{font-size:2rem;font-weight:800;text-transform:uppercase}
.page-h p{margin:2px 0 0;color:var(--ink-2);font-size:.9rem}

/* ---------- navegação inferior ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--black);color:#fff;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:flex;gap:0;max-width:980px;width:100%}
nav.tabs .in::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 1 0;min-width:0;min-height:56px;padding:0 1px;border:0;background:none;color:rgba(255,255,255,.7);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;cursor:pointer;
  font-family:var(--f-display);font-size:.8rem;font-weight:700;letter-spacing:0}
nav.tabs .sh{display:none}
@media (max-width:620px){nav.tabs .lg{display:none}nav.tabs .sh{display:block}}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:360px){nav.tabs button{font-size:.68rem}}
nav.tabs button svg{width:22px;height:22px;flex:none}
nav.tabs button[aria-current="page"]{color:#fff;background:var(--red)}

/* ---------- componentes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-size:1.25rem;font-weight:700;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{font-family:var(--f-body);text-transform:none;font-size:.78rem;color:var(--ink-2);font-weight:500}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.md2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-width:0}
.kpi .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.red{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.kpi.red .l{color:rgba(255,255,255,.85)}
.kpi.black{background:var(--black);color:var(--black-ink);border-color:var(--black)}
.kpi.black .l{color:rgba(255,255,255,.7)}
.kpi .s{font-size:.75rem;color:var(--ink-2);margin-top:2px}
.kpi.red .s,.kpi.black .s{color:rgba(255,255,255,.75)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--ink-2)}
.small{font-size:.82rem}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.debt{background:var(--red-soft);color:var(--red)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.credit{background:var(--warn-soft);color:var(--warn)}
.pill.cap{background:var(--black);color:#fff}
.pill.staff{background:var(--surface-2);color:var(--ink-2)}
.pill.void{background:var(--surface-2);color:var(--ink-2);text-decoration:line-through}
.pill.imp{background:var(--warn-soft);color:var(--warn)}

.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.btn.dark{background:var(--black);color:#fff;border-color:var(--black)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{min-height:38px;padding:0 12px;font-size:.85rem;border-radius:10px}

/* listas */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .d{font-size:.8rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.li .amt{font-family:var(--f-display);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.li.tap{cursor:pointer}
.li.tap:active{background:var(--surface-2)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;
  background:var(--surface-2);color:var(--ink);font-size:1rem;border:2px solid var(--line)}
.av.cap{border-color:var(--red)}
.empty{padding:18px 4px;color:var(--ink-2);text-align:center;font-size:.9rem}

/* tabela */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:12px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:700}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:active{background:var(--surface-2)}
tfoot td{font-weight:800;border-bottom:0;border-top:2px solid var(--ink)}

/* segmentado */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:none;font-weight:700;cursor:pointer;color:var(--ink-2);font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* formulários */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.86rem;min-width:0}
.f input,.f select,.f textarea{min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;width:100%}
.f textarea{min-height:76px;resize:vertical}
.hint{font-size:.78rem;color:var(--ink-2);font-weight:400}
.err{background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:10px;font-size:.88rem;font-weight:600}
.okmsg{background:var(--good-soft);color:var(--good);padding:10px 12px;border-radius:10px;font-size:.88rem;font-weight:600}
.warnbox{background:var(--warn-soft);color:var(--warn);padding:12px;border-radius:10px;font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;font-weight:700;cursor:pointer}
.stepper input{text-align:center;max-width:90px}
.totalbar{display:flex;justify-content:space-between;align-items:center;background:var(--black);color:#fff;padding:12px 14px;border-radius:12px}
.totalbar b{font-family:var(--f-display);font-size:1.6rem}

/* folha (modal) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-h h3{font-size:1.5rem;text-transform:uppercase;flex:1}

/* rankings */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:6px 0 10px}
.pod{text-align:center;border-radius:12px 12px 4px 4px;padding:10px 6px;color:#fff;min-width:0}
.pod .n{font-family:var(--f-display);font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .v{font-size:.82rem;opacity:.9}
.pod .p{font-family:var(--f-display);font-weight:800;font-size:2.2rem;line-height:1}
.pod.p1{background:var(--red);padding-block:18px}
.pod.p2{background:var(--black)}
.pod.p3{background:#5a5254}
.rank{width:30px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem;flex:none}
.bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--red);border-radius:9px}

.chart-box{position:relative;height:240px}
.chart-box.tall{height:320px}
.toast{display:flex;align-items:center;gap:12px;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 20px);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}

.toast-btn{border:0;background:var(--red);color:#fff;font-weight:800;border-radius:8px;min-height:36px;padding:0 12px;cursor:pointer}
.offline{background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:.85rem;padding:10px 12px;border-radius:12px;margin-bottom:12px}
.me-card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:2px solid var(--red);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;cursor:pointer}
.me-card .big{font-family:var(--f-display);font-weight:800;font-size:clamp(1.55rem,7.5vw,2.1rem);line-height:1;font-variant-numeric:tabular-nums}
.me-card .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:700}
.type-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.type-chips .chip{white-space:nowrap;flex:none}
/* entrada */
.auth{min-height:100vh;display:flex;flex-direction:column}
.auth-hero{background:linear-gradient(160deg,var(--red) 0 55%,var(--black) 55% 100%);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 36px) 16px 40px;text-align:center}
.auth-hero img{width:120px;height:120px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
.auth-hero h1{font-size:2.6rem;font-weight:800;margin-top:10px}
.auth-hero p{margin:4px 0 0;opacity:.85}
.auth-body{padding:20px 16px 40px;max-width:440px;width:100%;margin:-20px auto 0}
.linkbox{word-break:break-all;background:var(--surface-2);padding:10px;border-radius:10px;font-size:.8rem;user-select:all}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="icons.js"></script>

</body>
